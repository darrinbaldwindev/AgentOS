name: Scheduler Roundtrip Test

on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'Manual test phase'
        required: true
        default: '1'
        type: choice
        options: ['1', '2', '3']
  schedule:
    # One deterministic wake every 15 minutes. Each scheduled wake advances
    # the mailbox chain by one phase, then the next wake starts a new cycle.
    - cron: '*/15 * * * *'

permissions:
  contents: read
  issues: write

env:
  TEST_ISSUE: '62'
  TEST_ID: 'scheduler-roundtrip-001'

concurrency:
  group: scheduler-roundtrip-test
  cancel-in-progress: false

jobs:
  scheduler-roundtrip:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Advance one scheduled test phase
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEDULED_CRON: ${{ github.event.schedule }}
          MANUAL_PHASE: ${{ inputs.phase }}
        shell: bash
        run: |
          set -euo pipefail

          comments="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${TEST_ISSUE}/comments")"
          latest="$(echo "$comments" | jq -r '.[-1].body // empty')"
          run_count="$(echo "$comments" | jq '[.[] | select(.body | contains("<!-- scheduler-test:heartbeat -->"))] | length')"
          completed_count="$(echo "$comments" | jq '[.[] | select(.body | contains("<!-- scheduler-test:complete -->"))] | length')"
          failed_count="$(echo "$comments" | jq '[.[] | select(.body | contains("<!-- scheduler-test:failure -->"))] | length')"
          next_run_count=$((run_count + 1))

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            phase="${MANUAL_PHASE}"
          elif echo "$latest" | grep -q '<!-- scheduler-test:response -->'; then
            phase="3"
          elif echo "$latest" | grep -q '<!-- scheduler-test:task -->'; then
            phase="2"
          else
            phase="1"
          fi

          echo "Scheduled cron=${SCHEDULED_CRON:-manual}; selected phase=${phase}; run_count=${next_run_count}; completed_round_trips=${completed_count}; failures=${failed_count}"

          case "$phase" in
            1)
              trace="${TEST_ID}-$(date -u +%Y%m%d%H%M%S)-${GITHUB_RUN_ID}"
              task_id="${TEST_ID}-${GITHUB_RUN_ID}"
              body="<!-- scheduler-test:heartbeat -->\n## Scheduler Trigger Heartbeat\n- test_id: ${TEST_ID}\n- run_count: ${next_run_count}\n- completed_round_trips: ${completed_count}\n- failed_runs: ${failed_count}\n- scheduled_cron: ${SCHEDULED_CRON:-manual}\n- run_id: ${GITHUB_RUN_ID}\n- observed_at: $(date -u +%Y-%m-%dT%H:%M:%SZ)\n- phase: 1\n\n<!-- scheduler-test:task -->\n## ChatGPT Overseer → Project Overseer\n- test_id: ${TEST_ID}\n- task_id: ${task_id}\n- wake_trace_id: ${trace}\n- objective: execute bounded scheduler round-trip test\n- authority: test-only, no production side effects\n- expected_response: return the same task_id and wake_trace_id with verification evidence"
              gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${TEST_ISSUE}/comments" -f body="$body"
              ;;

            2)
              task_body="$(echo "$comments" | jq -r '[.[] | select(.body | contains("<!-- scheduler-test:task -->")) | .body] | last // empty')"
              if [ -z "$task_body" ]; then
                gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${TEST_ISSUE}/comments" -f body="<!-- scheduler-test:failure -->\n## Scheduler Test Failure\n- run_count: ${next_run_count}\n- observed_at: $(date -u +%Y-%m-%dT%H:%M:%SZ)\n- reason: ChatGPT task has not arrived before Project Overseer phase"
                echo "ERROR: ChatGPT task has not arrived before Project Overseer phase."
                exit 1
              fi
              trace="$(printf '%s\n' "$task_body" | sed -n 's/.*wake_trace_id: \([^ ]*\).*/\1/p')"
              task_id="$(printf '%s\n' "$task_body" | sed -n 's/.*task_id: \([^ ]*\).*/\1/p')"
              if [ -z "$trace" ] || [ -z "$task_id" ]; then
                gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${TEST_ISSUE}/comments" -f body="<!-- scheduler-test:failure -->\n## Scheduler Test Failure\n- run_count: ${next_run_count}\n- observed_at: $(date -u +%Y-%m-%dT%H:%M:%SZ)\n- reason: task correlation fields missing"
                echo "ERROR: task correlation fields missing."
                exit 1
              fi
              body="<!-- scheduler-test:response -->\n## Project Overseer → ChatGPT Overseer\n- test_id: ${TEST_ID}\n- task_id: ${task_id}\n- wake_trace_id: ${trace}\n- status: COMPLETED\n- source_agent: agentos:project-overseer-test\n- implemented: bounded scheduler-chain execution\n- verification: task and trace correlation preserved\n- evidence: scheduled test mailbox round-trip"
              gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${TEST_ISSUE}/comments" -f body="$body"
              ;;

            3)
              task_body="$(echo "$comments" | jq -r '[.[] | select(.body | contains("<!-- scheduler-test:task -->")) | .body] | last // empty')"
              response_body="$(echo "$comments" | jq -r '[.[] | select(.body | contains("<!-- scheduler-test:response -->")) | .body] | last // empty')"
              if [ -z "$task_body" ] || [ -z "$response_body" ]; then
                gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${TEST_ISSUE}/comments" -f body="<!-- scheduler-test:failure -->\n## Scheduler Test Failure\n- run_count: ${next_run_count}\n- observed_at: $(date -u +%Y-%m-%dT%H:%M:%SZ)\n- reason: round-trip is incomplete"
                echo "ERROR: round-trip is incomplete."
                exit 1
              fi
              task_id="$(printf '%s\n' "$task_body" | sed -n 's/.*task_id: \([^ ]*\).*/\1/p')"
              task_trace="$(printf '%s\n' "$task_body" | sed -n 's/.*wake_trace_id: \([^ ]*\).*/\1/p')"
              response_id="$(printf '%s\n' "$response_body" | sed -n 's/.*task_id: \([^ ]*\).*/\1/p')"
              response_trace="$(printf '%s\n' "$response_body" | sed -n 's/.*wake_trace_id: \([^ ]*\).*/\1/p')"
              test "$task_id" = "$response_id"
              test "$task_trace" = "$response_trace"
              new_completed_count=$((completed_count + 1))
              body="<!-- scheduler-test:complete -->\n## Scheduler Round-Trip GREEN Evidence\n- test_id: ${TEST_ID}\n- task_id: ${task_id}\n- wake_trace_id: ${task_trace}\n- status: GREEN\n- run_count: ${next_run_count}\n- completed_round_trips: ${new_completed_count}\n- failed_runs: ${failed_count}\n- evidence: ChatGPT delegation → Project Overseer execution → ChatGPT reconciliation\n- observed_at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${TEST_ISSUE}/comments" -f body="$body"
              echo "GREEN TEST EVIDENCE: preserved task_id and wake_trace_id across the complete scheduled chain."
              ;;

            *)
              echo "ERROR: invalid phase $phase"
              exit 1
              ;;
          esac
