name: Scheduler Roundtrip Test

on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'Manual test mode'
        required: true
        default: 'full'
        type: choice
        options: ['full', '1', '2', '3']
  schedule:
    # GitHub Actions schedules are best-effort rather than real-time timers.
    # The scheduled invocation therefore runs the complete test chain in one
    # job; timing jitter cannot strand the mailbox between phases.
    - cron: '*/5 * * * *'

permissions:
  contents: read
  issues: write

env:
  TEST_ISSUE: '62'
  TEST_ID: 'scheduler-roundtrip-001'

concurrency:
  group: scheduler-roundtrip-test
  cancel-in-progress: false

jobs:
  scheduler-roundtrip:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Execute governed scheduler test
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEDULED_CRON: ${{ github.event.schedule }}
          MANUAL_MODE: ${{ inputs.phase }}
        shell: bash
        run: |
          set -euo pipefail

          comments="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${TEST_ISSUE}/comments")"
          run_count="$(echo "$comments" | jq '[.[] | select(.body | contains("<!-- scheduler-test:heartbeat -->"))] | length')"
          completed_count="$(echo "$comments" | jq '[.[] | select(.body | contains("<!-- scheduler-test:complete -->"))] | length')"
          failed_count="$(echo "$comments" | jq '[.[] | select(.body | contains("<!-- scheduler-test:failure -->"))] | length')"
          next_run_count=$((run_count + 1))
          observed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mode="${MANUAL_MODE:-full}"

          echo "event=${GITHUB_EVENT_NAME} mode=${mode} cron=${SCHEDULED_CRON:-manual} run_count=${next_run_count} completed=${completed_count} failures=${failed_count}"

          if [ "$mode" = "1" ]; then
            trace="${TEST_ID}-$(date -u +%Y%m%d%H%M%S)-${GITHUB_RUN_ID}"
            task_id="${TEST_ID}-${GITHUB_RUN_ID}"
            body="<!-- scheduler-test:heartbeat -->\n## Scheduler Trigger Heartbeat\n- test_id: ${TEST_ID}\n- run_count: ${next_run_count}\n- completed_round_trips: ${completed_count}\n- failed_runs: ${failed_count}\n- scheduled_cron: ${SCHEDULED_CRON:-manual}\n- run_id: ${GITHUB_RUN_ID}\n- observed_at: ${observed_at}\n- phase: 1\n\n<!-- scheduler-test:task -->\n## Automated Scheduler → Test Mailbox\n- test_id: ${TEST_ID}\n- task_id: ${task_id}\n- wake_trace_id: ${trace}\n- objective: exercise the governed scheduler mailbox round-trip\n- authority: test-only, no production side effects\n- expected_response: return the same task_id and wake_trace_id with verification evidence"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${TEST_ISSUE}/comments" -f body="$body"
            exit 0
          fi

          if [ "$mode" = "2" ]; then
            task_body="$(echo "$comments" | jq -r '[.[] | select(.body | contains("<!-- scheduler-test:task -->")) | .body] | last // empty')"
            test -n "$task_body"
            trace="$(printf '%s\n' "$task_body" | sed -n 's/.*wake_trace_id: \([^ ]*\).*/\1/p')"
            task_id="$(printf '%s\n' "$task_body" | sed -n 's/.*task_id: \([^ ]*\).*/\1/p')"
            test -n "$trace"; test -n "$task_id"
            body="<!-- scheduler-test:response -->\n## Automated Test Worker → Mailbox\n- test_id: ${TEST_ID}\n- task_id: ${task_id}\n- wake_trace_id: ${trace}\n- status: COMPLETED\n- source_agent: agentos:project-overseer-test\n- implemented: bounded scheduler-chain execution\n- verification: task and trace correlation preserved\n- evidence: manual phase-2 mailbox response"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${TEST_ISSUE}/comments" -f body="$body"
            exit 0
          fi

          if [ "$mode" = "3" ]; then
            task_body="$(echo "$comments" | jq -r '[.[] | select(.body | contains("<!-- scheduler-test:task -->")) | .body] | last // empty')"
            response_body="$(echo "$comments" | jq -r '[.[] | select(.body | contains("<!-- scheduler-test:response -->")) | .body] | last // empty')"
            test -n "$task_body"; test -n "$response_body"
            task_id="$(printf '%s\n' "$task_body" | sed -n 's/.*task_id: \([^ ]*\).*/\1/p')"
            task_trace="$(printf '%s\n' "$task_body" | sed -n 's/.*wake_trace_id: \([^ ]*\).*/\1/p')"
            response_id="$(printf '%s\n' "$response_body" | sed -n 's/.*task_id: \([^ ]*\).*/\1/p')"
            response_trace="$(printf '%s\n' "$response_body" | sed -n 's/.*wake_trace_id: \([^ ]*\).*/\1/p')"
            test "$task_id" = "$response_id"; test "$task_trace" = "$response_trace"
            body="<!-- scheduler-test:complete -->\n## Scheduler Round-Trip GREEN Evidence\n- test_id: ${TEST_ID}\n- task_id: ${task_id}\n- wake_trace_id: ${task_trace}\n- status: GREEN\n- run_count: ${next_run_count}\n- completed_round_trips: $((completed_count + 1))\n- failed_runs: ${failed_count}\n- evidence: manual phase chain correlation verified\n- observed_at: ${observed_at}\n- evidence_boundary: manual mailbox verification only; it does not prove scheduled unattended execution"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${TEST_ISSUE}/comments" -f body="$body"
            exit 0
          fi

          # Scheduled/full mode: perform all three phases inside one invocation.
          # This deliberately removes dependence on exact GitHub scheduler timing.
          trace="${TEST_ID}-$(date -u +%Y%m%d%H%M%S)-${GITHUB_RUN_ID}"
          task_id="${TEST_ID}-${GITHUB_RUN_ID}"

          heartbeat="<!-- scheduler-test:heartbeat -->\n## Scheduler Trigger Heartbeat\n- test_id: ${TEST_ID}\n- run_count: ${next_run_count}\n- completed_round_trips: ${completed_count}\n- failed_runs: ${failed_count}\n- scheduled_cron: ${SCHEDULED_CRON:-manual}\n- run_id: ${GITHUB_RUN_ID}\n- observed_at: ${observed_at}\n- phase: full\n- timing_policy: scheduler timing is best-effort; chain is execution-local\n\n<!-- scheduler-test:task -->\n## Automated Scheduler → Test Mailbox\n- test_id: ${TEST_ID}\n- task_id: ${task_id}\n- wake_trace_id: ${trace}\n- objective: exercise the governed scheduler mailbox round-trip\n- authority: test-only, no production side effects\n- expected_response: return the same task_id and wake_trace_id with verification evidence"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${TEST_ISSUE}/comments" -f body="$heartbeat"

          response="<!-- scheduler-test:response -->\n## Automated Test Worker → Mailbox\n- test_id: ${TEST_ID}\n- task_id: ${task_id}\n- wake_trace_id: ${trace}\n- status: COMPLETED\n- source_agent: agentos:project-overseer-test\n- implemented: bounded scheduler-chain execution\n- verification: task and trace correlation preserved\n- evidence: same-invocation automated test worker response"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${TEST_ISSUE}/comments" -f body="$response"

          task_id_check="$(printf '%s\n' "$heartbeat" | sed -n 's/.*task_id: \([^ ]*\).*/\1/p')"
          task_trace_check="$(printf '%s\n' "$heartbeat" | sed -n 's/.*wake_trace_id: \([^ ]*\).*/\1/p')"
          response_id="$(printf '%s\n' "$response" | sed -n 's/.*task_id: \([^ ]*\).*/\1/p')"
          response_trace="$(printf '%s\n' "$response" | sed -n 's/.*wake_trace_id: \([^ ]*\).*/\1/p')"
          test "$task_id_check" = "$response_id"
          test "$task_trace_check" = "$response_trace"

          body="<!-- scheduler-test:complete -->\n## Scheduler Round-Trip GREEN Evidence\n- test_id: ${TEST_ID}\n- task_id: ${task_id}\n- wake_trace_id: ${trace}\n- status: GREEN\n- run_count: ${next_run_count}\n- completed_round_trips: $((completed_count + 1))\n- failed_runs: ${failed_count}\n- evidence: scheduled wake → test task → automated test worker response → correlation verification, all within one scheduled invocation\n- observed_at: ${observed_at}\n- timing_policy: GitHub scheduler timing is best-effort; correctness does not depend on a five-minute phase boundary\n- evidence_boundary: this proves the GitHub scheduled mailbox test path; it does not prove an independent production Project Overseer process executed the test"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${TEST_ISSUE}/comments" -f body="$body"
          echo "GREEN TEST EVIDENCE: scheduled invocation completed the full governed mailbox correlation chain."
