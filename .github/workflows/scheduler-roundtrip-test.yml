name: Scheduler Roundtrip Test

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions is the clock only. The complete wake test runs in one
    # invocation through the same governed GitHub wake contract used by tests.
    - cron: '*/5 * * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: scheduler-roundtrip-test
  cancel-in-progress: false

jobs:
  scheduler-roundtrip:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out AgentOS
        uses: actions/checkout@v4

      - name: Execute canonical governed wake
        id: wake
        env:
          AGENTOS_TRIGGER: ${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }}
        shell: bash
        run: |
          set -euo pipefail
          result="$(node scripts/scheduled-wake-test.mjs)"
          echo "$result" | jq .
          test "$(echo "$result" | jq -r .status)" = "GREEN"
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Record durable scheduler evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.wake.outputs.result }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULED_CRON: ${{ github.event.schedule }}
        shell: bash
        run: |
          set -euo pipefail
          task_id="$(echo "$RESULT" | jq -r .task_id)"
          trace="$(echo "$RESULT" | jq -r .wake_trace_id)"
          source_agent="$(echo "$RESULT" | jq -r .source_agent)"
          status="$(echo "$RESULT" | jq -r .status)"
          trigger="$(echo "$RESULT" | jq -r .trigger)"
          body="<!-- scheduler-test:complete -->\n## Scheduler Round-Trip GREEN Evidence\n- test_id: scheduler-roundtrip-002\n- trigger: ${trigger}\n- event: ${EVENT_NAME}\n- scheduled_cron: ${SCHEDULED_CRON:-manual}\n- task_id: ${task_id}\n- wake_trace_id: ${trace}\n- source_agent: ${source_agent}\n- status: ${status}\n- evidence: scheduler trigger → canonical GitHub wake contract → governed dispatch → registered test worker → correlation verification\n- observed_at: $(date -u +%Y-%m-%dT%H:%M:%SZ)\n- timing_policy: GitHub scheduler timing is best-effort; correctness does not depend on phase boundaries\n- evidence_boundary: this proves the canonical governed GitHub wake contract in the scheduled test environment; it does not prove an installed local AgentOS process was independently awakened by GitHub"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/62/comments" -f body="$body"
