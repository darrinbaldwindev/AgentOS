name: Project Overseer Wake

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Production schedule intentionally PAUSED during scheduler integration testing.
# Re-enable only after the three-phase scheduled round-trip gate passes.
permissions:
  contents: read

concurrency:
  group: project-overseer-wake
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run deterministic wake verification
        run: node --test tests/project-overseer-schedule.test.mjs tests/local-cycle.test.mjs tests/github-wake.test.mjs tests/github-wake-lease.test.mjs tests/lease.test.mjs tests/project-overseer-response-validator.test.mjs tests/persistence.test.mjs tests/shared-reference-persistence.test.mjs
