name: Project Overseer Wake

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: project-overseer-wake
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run deterministic wake verification
        run: node --test tests/local-cycle.test.mjs tests/github-wake.test.mjs tests/github-wake-lease.test.mjs tests/lease.test.mjs tests/project-overseer-response-validator.test.mjs
