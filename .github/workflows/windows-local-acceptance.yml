name: Windows Local Acceptance

on:
  pull_request:
    paths:
      - 'scripts/install-local.mjs'
      - 'scripts/doctor-local.mjs'
      - 'scripts/boot-local.mjs'
      - 'runtime/**'
      - 'tests/**'
      - '.github/workflows/windows-local-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-local-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-local-acceptance:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out AgentOS
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run repository tests
        shell: pwsh
        run: npm test

      - name: Install into isolated clean home
        shell: pwsh
        run: |
          $env:AGENTOS_HOME = Join-Path $env:RUNNER_TEMP 'agentos-clean'
          npm run install:local

      - name: Verify safe install with doctor
        shell: pwsh
        run: |
          $env:AGENTOS_HOME = Join-Path $env:RUNNER_TEMP 'agentos-clean'
          npm run doctor:local

      - name: Verify safe boot
        shell: pwsh
        run: |
          $env:AGENTOS_HOME = Join-Path $env:RUNNER_TEMP 'agentos-clean'
          $result = npm run boot:local 2>&1 | Out-String
          $result
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify install idempotence and scheduler remains disabled
        shell: pwsh
        run: |
          $env:AGENTOS_HOME = Join-Path $env:RUNNER_TEMP 'agentos-clean'
          npm run install:local
          $configPath = Join-Path $env:AGENTOS_HOME 'config.json'
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          if ($config.mode -ne 'DRY_RUN') { throw 'MODE_NOT_DRY_RUN' }
          if ($config.autonomyEnabled -ne $false) { throw 'AUTONOMY_NOT_DISABLED' }
          if ($config.scheduler.enabled -ne $false) { throw 'SCHEDULER_NOT_DISABLED' }

      - name: Verify canonical local wake path
        shell: pwsh
        run: |
          $env:AGENTOS_HOME = Join-Path $env:RUNNER_TEMP 'agentos-clean'
          $env:NODE_NO_WARNINGS = '1'
          $wakeOutput = npm run wake:local 2>&1 | Out-String
          $wakeOutput
          if ($LASTEXITCODE -ne 0) { throw 'WAKE_EXECUTION_FAILED' }
          $wakeJson = $wakeOutput | ConvertFrom-Json
          if ($wakeJson.status -ne 'COMPLETED') { throw 'WAKE_STATUS_NOT_COMPLETED' }
          if (-not $wakeJson.task_id) { throw 'WAKE_TASK_ID_MISSING' }
          if (-not $wakeJson.mission_id) { throw 'WAKE_MISSION_ID_MISSING' }
          if (-not $wakeJson.wake_trace_id) { throw 'WAKE_TRACE_ID_MISSING' }
          if ($wakeJson.mode -ne 'DRY_RUN') { throw 'WAKE_MODE_NOT_DRY_RUN' }
          if ($wakeJson.autonomyEnabled -ne $false) { throw 'WAKE_AUTONOMY_NOT_DISABLED' }
          Write-Host "✓ Wake completed with correlated task/mission/wake evidence in DRY_RUN mode"

      - name: Verify persistence boundary and continuity
        shell: pwsh
        run: |
          $env:AGENTOS_HOME = Join-Path $env:RUNNER_TEMP 'agentos-clean'
          $env:NODE_NO_WARNINGS = '1'
          npm run doctor:local
          if ($LASTEXITCODE -ne 0) { throw 'DOCTOR_POST_WAKE_FAILED' }
          $wakeOutput2 = npm run wake:local 2>&1 | Out-String
          $wakeOutput2
          if ($LASTEXITCODE -ne 0) { throw 'SECOND_WAKE_EXECUTION_FAILED' }
          $wakeJson2 = $wakeOutput2 | ConvertFrom-Json
          if ($wakeJson2.status -ne 'COMPLETED') { throw 'SECOND_WAKE_STATUS_NOT_COMPLETED' }
          if ($wakeJson2.mode -ne 'DRY_RUN') { throw 'SECOND_WAKE_MODE_NOT_DRY_RUN' }
          if ($wakeJson2.autonomyEnabled -ne $false) { throw 'SECOND_WAKE_AUTONOMY_NOT_DISABLED' }
          Write-Host "✓ Second wake after persistence boundary demonstrates continuity"

